<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#80f9b7"/>
      <stop offset="1" stop-color="#9abdeb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 824px tile inside a 1024px canvas, the margin macOS expects around app icons -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <path d="M420 330 L690 512 L420 694 Z" fill="#fa7fc3" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
</svg>
